<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語・英熟語4択クイズ</title>
  <style>
    body {background:#f5f7fa;font-family:'Segoe UI',Arial,sans-serif;}
    .container {max-width:400px;margin:40px auto;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(50,80,150,0.07);padding:32px 24px;}
    h1 {text-align:center;margin-bottom:20px;color:#125199;}
    .select-mode {text-align:center;margin:24px 0;}
    .mode-btn {padding:13px 38px;margin:0 10px;background:#125199;color:#fff;border:none;border-radius:8px;font-size:19px;cursor:pointer;transition:background 0.18s;}
    .mode-btn:hover {background:#3379cddc;}
    #quiz {min-height:100px;text-align:center;font-size:18px;margin-top:12px;}
    .question {margin-bottom:14px;color:#195ea9;font-size:19px;}
    .options button {background:#eaf4fc;border:none;border-radius:8px;width:94%;margin:8px auto;padding:12px 0;font-size:18px;cursor:pointer;transition:background 0.2s;display:block;color:#225;}
    .options button:hover {background:#bad9fa;}
    .result {margin:16px 0 8px 0;font-size:19px;font-weight:bold;color:#2e8b57;}
    .next-btn {padding:10px 36px;border:none;background:#125199;color:#fff;border-radius:7px;font-size:17px;cursor:pointer;margin:18px auto 0 auto;display:block;transition:background 0.16s;}
    .next-btn:hover {background:#094878;}
    #loading {text-align:center;color:#888;margin-top:12px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>英単語・英熟語4択クイズ</h1>
    <div class="select-mode" id="modeSelect">
      <button class="mode-btn" onclick="selectMode('words.csv')">英単語</button>
      <button class="mode-btn" onclick="selectMode('idioms.csv')">英熟語</button>
    </div>
    <div id="loading"></div>
    <div id="quiz"></div>
  </div>
  <script>
    let words = [];
    function selectMode(csvPath) {
      document.getElementById('modeSelect').style.display = "none";
      document.getElementById('loading').textContent = "CSV読み込み中...";
      fetch(csvPath)
        .then(res => {
          if (!res.ok) throw new Error("CSVが見つかりません");
          return res.text();
        })
        .then(text => {
          words = text.trim().split('\n').map(line => {
            let [english, japanese] = line.split(',');
            return { english, japanese };
          });
          document.getElementById('loading').textContent = "";
          showQuestion();
        })
        .catch(e => {
          document.getElementById('loading').textContent = "CSV読み込みに失敗しました: " + e.message;
        });
    }
    function showQuestion() {
      if (words.length < 4) {
        document.getElementById('quiz').innerHTML = "<div class='result'>単語数が4つ以上必要です</div>";
        return;
      }
      const correct = words[Math.floor(Math.random() * words.length)];
      const options = [correct];
      while (options.length < 4) {
        const candidate = words[Math.floor(Math.random() * words.length)];
        if (!options.some(opt => opt.english === candidate.english)) options.push(candidate);
      }
      options.sort(() => Math.random() - 0.5);
      let html = `<div class="question">「${correct.japanese}」の英語は？</div>`;
      html += `<div class="options">`;
      options.forEach(opt => {
        html += `<button onclick="checkAnswer('${opt.english}', '${correct.english}')">${opt.english}</button>`;
      });
      html += `</div>`;
      document.getElementById('quiz').innerHTML = html;
    }
    function checkAnswer(selected, correct) {
      const resultText = selected === correct ? "正解！" : `不正解… 正解は ${correct}`;
      let html = `<div class="result">${resultText}</div><button class="next-btn" onclick="showQuestion()">次の問題</button>`;
      document.getElementById('quiz').innerHTML += html;
    }
  </script>
</body>
</html>
